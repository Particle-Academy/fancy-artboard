name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      # One-time BOOTSTRAP step: publishes via NPM_TOKEN because npm won't let
      # us configure Trusted Publishing until the package already exists. After
      # the first publish lands, configure the Trusted Publisher on npmjs.com,
      # revoke the token, and delete the `env:` block below — leaving tokenless
      # OIDC (the steady-state every other package uses).
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx -y npm@latest publish --provenance --access public
